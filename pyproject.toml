
[project]
name = "platon-agent"
version = "0.1.0"
description = "Local multi-agent assistant built with LangChain, LangGraph, Chroma, and Ollama."
requires-python = ">=3.13,<3.14"

dependencies = [
    # HTTP / Networking
    "aiohttp==3.13.2",
    "requests==2.34.2",
    "ddgs==9.14.4",

    # DeepAgents
    "deepagents>=0.7.25,<0.8.0",

    # LangChain
    "langchain>=1.4.5,<2.0.0",
    "langchain-core>=1.6.10,<2.0.0",
    "langchain-community==0.4.1",
    "langchain-experimental==0.4.1",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.0",

    # LangGraph
    "langgraph>=1.2.12,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.1.2,<4.0.0",

    # Vector Database
    "chromadb==1.4.0",

    # AI / Embeddings
    "numpy==2.4.0",
    "sentence-transformers==5.2.0",
    "transformers==4.57.3",

    # Documents
    "pypdf==6.5.0",
    "python-docx==1.2.0",

    # Configuration
    "pydantic==2.13.4",
    "python-dotenv==1.2.1",
]

[tool.uv]
package = false
