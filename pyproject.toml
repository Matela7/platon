
[project]
name = "platon-agent"
version = "0.1.0"
description = "Local multi-agent assistant built with LangChain, LangGraph, Chroma, and Ollama."
requires-python = ">=3.13,<3.14"

dependencies = [
    # HTTP / Networking
    "aiohttp==3.13.2",
    "fastapi>=0.135,<1.0",
    "uvicorn>=0.30,<1.0",
    "requests==2.34.2",
    "ddgs==9.14.4",

    # DeepAgents
    "deepagents>=0.7.25,<0.8.0",

    # LangChain
    "langchain[mcp]>=1.4.6,<2.0.0",
    "fastmcp>=4.0.11,<5.0.0",
    "anyio>=4.0,<5.0",
    "langchain-core>=1.6.10,<2.0.0",
    "langchain-community==0.4.1",
    "langchain-experimental==0.4.1",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.0",

    # LangGraph
    "langgraph>=1.2.12,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.1.2,<4.0.0",

    # Vector Database
    "chromadb==1.4.0",

    # AI / Embeddings
    "numpy==2.4.0",
    "sentence-transformers==5.2.0",
    "transformers==4.57.3",

    # Documents
    "pypdf==6.5.0",
    "python-docx==1.2.0",

    # Configuration
    "pydantic==2.13.4",
    "python-dotenv==1.2.1",
]

[project.scripts]
# Terminal CLI entry point. The browser UI keeps its existing run_agent_chat_ui.py launcher.
platon = "platon.run_agent_chat:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["platon*"]

[tool.setuptools.package-data]
"platon.agent" = ["prompts/*.md", "prompts/agents/*.md"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
]
