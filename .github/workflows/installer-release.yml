name: All desktop installers (manual)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload installers to a draft GitHub Release after all builds pass
        type: boolean
        default: false
      tag:
        description: Release tag (for example v0.1.1); required to publish
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: installer-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.source.outputs.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Resolve existing release tag
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            exit 0
          fi
          git check-ref-format "refs/tags/$TAG"
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG"; then
            git fetch --no-tags origin "refs/tags/$TAG"
            git checkout --detach FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Could not check the remote tag (exit $status)."
              exit "$status"
            fi
            echo "Tag $TAG is missing; it will be created on $GITHUB_SHA after version validation."
          fi
      - name: Validate release version before building
        if: inputs.publish
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('platon_frontend/package.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Publishing requires tag v{version}, matching the app version.')
          PY
      - name: Publish and verify release tag before building
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Recheck in case another run published the tag after the first lookup.
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG"; then
            git fetch --no-tags origin "refs/tags/$TAG"
            if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $TAG now points to another commit. Rerun to build that tag."
              exit 1
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Could not check the remote tag (exit $status)."
              exit "$status"
            fi
            git tag -- "$TAG" "$GITHUB_SHA"
            # Never force or ignore a failed push, including a concurrent creation.
            git push origin "refs/tags/$TAG:refs/tags/$TAG"
            remote_tag=$(git ls-remote --exit-code --refs origin "refs/tags/$TAG")
            local_tag=$(git rev-parse "refs/tags/$TAG")
            if [ "${remote_tag%%[[:space:]]*}" != "$local_tag" ]; then
              echo "::error::Remote tag verification failed for $TAG."
              exit 1
            fi
          fi
      - name: Resolve one source commit for all platforms
        id: source
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    uses: ./.github/workflows/installer-windows.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  linux:
    needs: prepare
    uses: ./.github/workflows/installer-linux.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  macos:
    needs: prepare
    uses: ./.github/workflows/installer-macos.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  publish:
    needs: [prepare, windows, linux, macos]
    if: inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: platon-windows-x64
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: platon-linux-x64
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: platon-macos-arm64
          path: artifacts
      - name: Upload to draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --draft --target "${{ needs.prepare.outputs.ref }}" --title "$TAG" --notes "Native desktop installers. Review artifacts and signing before publishing."
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" artifacts/* --clobber
